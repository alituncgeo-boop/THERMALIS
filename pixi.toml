[workspace]
name = "thermalis"
version = "0.1.0"
description = "THERMALIS — Urban Climate Intelligence Framework"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
nodejs = "22.*"
fastapi = ">=0.115"
uvicorn = ">=0.30"
pydantic = ">=2.7"
platformdirs = ">=4.2"
pytest = ">=8"
httpx = ">=0.27"
gdal = ">=3.9"
boto3 = "==1.43.127"
botocore = "==1.43.127"
keyring = "==25.7.0"

# İkinci bilgisayar için hafif ortam: yalnız paket yükleyici (GDAL, Node, FastAPI yok).
# Kurulum: pixi install --environment upload · Kullanım: scripts\thermalis-upload.cmd (bkz. docs/cloud-intake.md)
[feature.upload.dependencies]
python = "3.12.*"
pydantic = ">=2.7"
platformdirs = ">=4.2"
boto3 = "==1.43.127"
botocore = "==1.43.127"
keyring = "==25.7.0"

[feature.upload.tasks]
upload-package = { cmd = "python -m thermalis.cloud.upload", cwd = "src" }

[environments]
upload = { features = ["upload"], no-default-feature = true }

[tasks]
# Arayüz bağımlılıklarını kur ve derle
install-ui = { cmd = "npm ci", cwd = "frontend" }
build-ui = { cmd = "npm run build", cwd = "frontend", depends-on = ["install-ui"] }
# Programı başlat (tarayıcıda açılır)
start = { cmd = "python -m thermalis start", cwd = "src", depends-on = ["build-ui"] }
# DATA kataloğu: pixi run data register "<paket klasörü>" · pixi run data list
data = { cmd = "python -m thermalis data", cwd = "src" }
# Nesne deposu: pixi run storage status · storage credentials set --role publisher
storage = { cmd = "python -m thermalis storage", cwd = "src" }
# CANLI R2 duman testi (yalnız elle; THERMALIS_R2_LIVE_TEST=1 gerekir; sentetik veri). Bkz. docs/cloud-storage.md
r2-smoke = { cmd = "python -m thermalis storage smoke-test --role publisher --confirm-live", cwd = "src" }
# CANLI uçtan uca bulut kabul testi (yalnız elle; sentetik; e2e-tests/<çalıştırma>/ ad alanı, geçici katalog)
r2-intake-e2e = { cmd = "python -m thermalis storage intake-e2e --role publisher --confirm-live", cwd = "src" }
# CANLI taşıma provası (yalnız elle; HD01 benzeri eski biçimli SENTETİK kayıtlar; e2e-tests/<çalıştırma>/ ad alanı)
r2-migration-rehearsal = { cmd = "python -m thermalis storage migration-rehearsal --confirm-live", cwd = "src" }
# Testler
test = "pytest -q"
test-ui = { cmd = "npm test", cwd = "frontend", depends-on = ["install-ui"] }
# Geliştirme: arka uç ve arayüz ayrı ayrı (iki terminal)
dev-api = { cmd = "python -m thermalis start --no-browser --reload", cwd = "src" }
dev-ui = { cmd = "npm run dev", cwd = "frontend" }
